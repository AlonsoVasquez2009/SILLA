<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usuarios — Mesas y Sillas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
  <link rel="stylesheet" href="css/componentes.css" />
</head>
<body>
  <nav class="barra-nav">
    <a href="inicio.html" class="barra-nav__marca">Mesas y Sillas</a>
    <div class="barra-nav__enlaces">
      <a href="dashboard.html">Dashboard</a>
      <a href="inventario.html">Inventario</a>
      <a href="reservas.html">Reservas</a>
      <a href="prestamos.html">Préstamos</a>
      <a href="historial.html">Historial</a>
      <a href="usuarios.html" class="activo">Usuarios</a>
    </div>
    <div class="barra-nav__usuario">
      <span id="usuario-actual"></span>
      <button class="boton boton--secundario" id="boton-logout">Salir</button>
    </div>
  </nav>

  <main class="contenedor">
    <h1>Usuarios</h1>

    <div class="tarjeta">
      <h2>Nuevo usuario</h2>
      <div id="mensaje-form"></div>
      <form id="form-usuario">
        <div class="form-fila">
          <div class="campo">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required />
          </div>
          <div class="campo">
            <label for="email">Correo</label>
            <input type="email" id="email" required />
          </div>
        </div>
        <div class="form-fila">
          <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" minlength="6" required />
          </div>
          <div class="campo">
            <label for="rol">Rol</label>
            <select id="rol">
              <option value="usuario">Usuario</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
        </div>
        <button type="submit" class="boton">Crear usuario</button>
      </form>
    </div>

    <div class="tarjeta">
      <h2>Lista de usuarios</h2>
      <div id="mensaje-lista"></div>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/usuarios.js"></script>
</body>
</html>
